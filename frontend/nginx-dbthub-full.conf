# Полный конфиг dbthub.ru: HTTP (редирект) + HTTPS (Vue + API + Guru)
# Использование:
#   1. Подставьте свои пути к проекту и сокету PHP (если отличаются).
#   2. cp frontend/nginx-dbthub-full.conf /etc/nginx/sites-available/dbthub.ru
#   3. ln -sf /etc/nginx/sites-available/dbthub.ru /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx

# === Порт 80 — редирект на HTTPS ===
server {
    listen 80;
    listen [::]:80;
    server_name dbthub.ru www.dbthub.ru;
    return 301 https://$host$request_uri;
}

# === Порт 443 — сайт (Vue SPA + Yii API + Yii Guru) ===
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dbthub.ru www.dbthub.ru;

    # SSL (Certbot)
    ssl_certificate /etc/letsencrypt/live/dbthub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbthub.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Корень для статики Vue (SPA)
    root /var/www/dbt/frontend/dist;
    index index.html;

    # API — Yii2 (web/index.php)
    location /api {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/dbt/web/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/dbt/web;
        include fastcgi_params;
    }

    # Публичные загрузки из Yii (аватары, фото карточек/тестов)
    location ^~ /uploads/ {
        alias /var/www/dbt/web/uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Новый раздел обучения: Vue SPA
    location ^~ /learning {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Старые Yii-вьюхи Гуру закрыты
    location ^~ /guru {
        return 410;
    }

    # SPA: все остальные пути — index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Кэш статики фронта
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
